          # 13. BluetoothDeviceModel.java
          cat << 'EOF' > app/src/main/java/com/example/bluetoothcall/BluetoothDeviceModel.java
          package com.example.bluetoothcall;

          import android.bluetooth.BluetoothDevice;

          public class BluetoothDeviceModel {
              private final String name;
              private final String address;
              private final BluetoothDevice device;

              public BluetoothDeviceModel(String name, String address, BluetoothDevice device) {
                  this.name = (name != null && !name.isEmpty()) ? name : ("جهاز غير معروف (" + address + ")");
                  this.address = address;
                  this.device = device;
              }

              public String getName() {
                  return name;
              }

              public String getAddress() {
                  return address;
              }

              public BluetoothDevice getDevice() {
                  return device;
              }

              @Override
              public boolean equals(Object o) {
                  if (this == o) return true;
                  if (o == null || getClass() != o.getClass()) return false;
                  BluetoothDeviceModel that = (BluetoothDeviceModel) o;
                  return address != null && address.equals(that.address);
              }

              @Override
              public int hashCode() {
                  return address != null ? address.hashCode() : 0;
              }
          }
          EOF

          # 14. DeviceAdapter.java
          cat << 'EOF' > app/src/main/java/com/example/bluetoothcall/DeviceAdapter.java
          package com.example.bluetoothcall;

          import android.content.Context;
          import android.view.LayoutInflater;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.ArrayAdapter;
          import android.widget.TextView;

          import androidx.annotation.NonNull;
          import androidx.annotation.Nullable;

          import java.util.List;

          public class DeviceAdapter extends ArrayAdapter<BluetoothDeviceModel> {
              public DeviceAdapter(Context context, List<BluetoothDeviceModel> devices) {
                  super(context, 0, devices);
              }

              @NonNull
              @Override
              public View getView(int position, @Nullable View convertView, @NonNull ViewGroup parent) {
                  if (convertView == null) {
                      convertView = LayoutInflater.from(getContext()).inflate(R.layout.item_device, parent, false);
                  }
                  BluetoothDeviceModel item = getItem(position);
                  if (item != null) {
                      TextView tvName = convertView.findViewById(R.id.tvItemDeviceName);
                      TextView tvAddr = convertView.findViewById(R.id.tvItemDeviceAddress);
                      tvName.setText(item.getName());
                      tvAddr.setText(item.getAddress());
                  }
                  return convertView;
              }
          }
          EOF

          # 15. BluetoothCallService.java
          cat << 'EOF' > app/src/main/java/com/example/bluetoothcall/BluetoothCallService.java
          package com.example.bluetoothcall;

          import android.annotation.SuppressLint;
          import android.bluetooth.BluetoothAdapter;
          import android.bluetooth.BluetoothDevice;
          import android.bluetooth.BluetoothServerSocket;
          import android.bluetooth.BluetoothSocket;
          import android.os.Handler;
          import android.os.Looper;

          import java.io.BufferedInputStream;
          import java.io.BufferedOutputStream;
          import java.io.DataInputStream;
          import java.io.DataOutputStream;
          import java.io.IOException;
          import java.lang.reflect.Method;
          import java.nio.charset.StandardCharsets;
          import java.util.UUID;

          public class BluetoothCallService {
              private static final UUID MY_UUID = UUID.fromString("00001101-0000-1000-8000-00805F9B34FB");
              private static final String APP_NAME = "BluetoothCall";

              public static final byte TYPE_HANDSHAKE = 0x01;
              public static final byte TYPE_AUDIO = 0x02;
              public static final byte TYPE_VIDEO = 0x03;
              public static final byte TYPE_END_CALL = 0x04;

              public interface CallListener {
                  void onConnected(String remoteDeviceName);
                  void onConnectionFailed();
                  void onConnectionLost();
                  void onVideoReceived(byte[] data);
                  void onAudioReceived(byte[] data);
                  void onCallEndedRemote();
              }

              private final BluetoothAdapter bluetoothAdapter;
              private final CallListener listener;
              private final Handler mainHandler;

              private AcceptThread acceptThread;
              private ConnectThread connectThread;
              private ConnectedThread connectedThread;
              private String localDeviceName = "مستخدم أندرويد";

              public BluetoothCallService(CallListener listener) {
                  this.bluetoothAdapter = BluetoothAdapter.getDefaultAdapter();
                  this.listener = listener;
                  this.mainHandler = new Handler(Looper.getMainLooper());
              }

              public synchronized void startServer(String deviceName) {
                  this.localDeviceName = deviceName;
                  stopAllThreads();
                  acceptThread = new AcceptThread();
                  acceptThread.start();
              }

              public synchronized void connect(BluetoothDevice device, String deviceName) {
                  this.localDeviceName = deviceName;
                  stopAllThreads();
                  connectThread = new ConnectThread(device);
                  connectThread.start();
              }

              public synchronized void sendVideoFrame(byte[] jpegBytes) {
                  if (connectedThread != null) {
                      connectedThread.write(TYPE_VIDEO, jpegBytes);
                  }
              }

              public synchronized void sendAudioData(byte[] pcmBytes) {
                  if (connectedThread != null) {
                      connectedThread.write(TYPE_AUDIO, pcmBytes);
                  }
              }

              public synchronized void endCall() {
                  if (connectedThread != null) {
                      connectedThread.write(TYPE_END_CALL, new byte[0]);
                  }
                  stopAllThreads();
              }

              public synchronized void stopAllThreads() {
                  if (connectThread != null) {
                      connectThread.cancel();
                      connectThread = null;
                  }
                  if (connectedThread != null) {
                      connectedThread.cancel();
                      connectedThread = null;
                  }
                  if (acceptThread != null) {
                      acceptThread.cancel();
                      acceptThread = null;
                  }
              }

              private synchronized void connected(BluetoothSocket socket) {
                  if (acceptThread != null) {
                      acceptThread.cancel();
                      acceptThread = null;
                  }
                  if (connectThread != null) {
                      connectThread.cancel();
                      connectThread = null;
                  }
                  connectedThread = new ConnectedThread(socket);
                  connectedThread.start();
              }

              @SuppressLint("MissingPermission")
              private class AcceptThread extends Thread {
                  private final BluetoothServerSocket serverSocket;
                  private volatile boolean isRunning = true;

                  public AcceptThread() {
                      BluetoothServerSocket tmp = null;
                      try {
                          tmp = bluetoothAdapter.listenUsingRfcommWithServiceRecord(APP_NAME, MY_UUID);
                      } catch (Exception e) {
                          e.printStackTrace();
                      }
                      serverSocket = tmp;
                  }

                  public void run() {
                      BluetoothSocket socket = null;
                      while (isRunning) {
                          try {
                              if (serverSocket != null) {
                                  socket = serverSocket.accept();
                              }
                          } catch (IOException e) {
                              break;
                          }
                          if (socket != null) {
                              synchronized (BluetoothCallService.this) {
                                  connected(socket);
                              }
                              try {
                                  if (serverSocket != null) serverSocket.close();
                              } catch (IOException ignored) {}
                              break;
                          }
                      }
                  }

                  public void cancel() {
                      isRunning = false;
                      try {
                          if (serverSocket != null) serverSocket.close();
                      } catch (IOException ignored) {}
                  }
              }

              @SuppressLint("MissingPermission")
              private class ConnectThread extends Thread {
                  private BluetoothSocket socket;
                  private final BluetoothDevice device;

                  public ConnectThread(BluetoothDevice device) {
                      this.device = device;
                      BluetoothSocket tmp = null;
                      try {
                          tmp = device.createRfcommSocketToServiceRecord(MY_UUID);
                      } catch (Exception e) {
                          e.printStackTrace();
                      }
                      this.socket = tmp;
                  }

                  public void run() {
                      if (bluetoothAdapter.isDiscovering()) {
                          bluetoothAdapter.cancelDiscovery();
                      }
                      try {
                          if (socket != null) {
                              socket.connect();
                          }
                      } catch (Exception e) {
                          try {
                              Method m = device.getClass().getMethod("createRfcommSocket", new Class[]{int.class});
                              socket = (BluetoothSocket) m.invoke(device, 1);
                              if (socket != null) {
                                  socket.connect();
                              }
                          } catch (Exception e2) {
                              try {
                                  if (socket != null) socket.close();
                              } catch (IOException ignored) {}
                              mainHandler.post(listener::onConnectionFailed);
                              return;
                          }
                      }

                      synchronized (BluetoothCallService.this) {
                          connected(socket);
                      }
                  }

                  public void cancel() {
                      try {
                          if (socket != null) socket.close();
                      } catch (IOException ignored) {}
                  }
              }

              private class ConnectedThread extends Thread {
                  private final BluetoothSocket socket;
                  private final DataInputStream dis;
                  private final DataOutputStream dos;
                  private volatile boolean isRunning = true;

                  public ConnectedThread(BluetoothSocket socket) {
                      this.socket = socket;
                      DataInputStream tmpIn = null;
                      DataOutputStream tmpOut = null;
                      try {
                          tmpIn = new DataInputStream(new BufferedInputStream(socket.getInputStream()));
                          tmpOut = new DataOutputStream(new BufferedOutputStream(socket.getOutputStream()));
                      } catch (IOException e) {
                          e.printStackTrace();
                      }
                      this.dis = tmpIn;
                      this.dos = tmpOut;
                  }

                  public void run() {
                      byte[] nameBytes = localDeviceName.getBytes(StandardCharsets.UTF_8);
                      write(TYPE_HANDSHAKE, nameBytes);

                      while (isRunning) {
                          try {
                              if (dis == null) break;
                              byte type = dis.readByte();
                              int length = dis.readInt();
                              if (length < 0 || length > 1000000) {
                                  break;
                              }
                              byte[] data = new byte[length];
                              dis.readFully(data);

                              switch (type) {
                                  case TYPE_HANDSHAKE:
                                      String remoteName = new String(data, StandardCharsets.UTF_8);
                                      mainHandler.post(() -> listener.onConnected(remoteName));
                                      break;
                                  case TYPE_AUDIO:
                                      listener.onAudioReceived(data);
                                      break;
                                  case TYPE_VIDEO:
                                      mainHandler.post(() -> listener.onVideoReceived(data));
                                      break;
                                  case TYPE_END_CALL:
                                      mainHandler.post(listener::onCallEndedRemote);
                                      isRunning = false;
                                      break;
                              }
                          } catch (IOException e) {
                              if (isRunning) {
                                  mainHandler.post(listener::onConnectionLost);
                              }
                              break;
                          }
                      }
                      cancel();
                  }

                  public synchronized void write(byte type, byte[] data) {
                      if (!isRunning || dos == null) return;
                      try {
                          dos.writeByte(type);
                          dos.writeInt(data.length);
                          dos.write(data);
                          dos.flush();
                      } catch (IOException e) {
                          isRunning = false;
                      }
                  }

                  public void cancel() {
                      isRunning = false;
                      try {
                          if (socket != null) socket.close();
                      } catch (IOException ignored) {}
                  }
              }
          }
