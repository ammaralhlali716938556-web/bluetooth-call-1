          import java.util.Set;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;

          public class MainActivity extends AppCompatActivity implements BluetoothCallService.CallListener {

              private static final int PERMISSION_REQ_CODE = 101;

              private View layoutSetup;
              private EditText etDeviceName;
              private Button btnCreate, btnJoin;
              private TextView tvStatus, tvDeviceListHeader;
              private ProgressBar pbScanning;
              private ListView lvDevices;

              private View layoutCall;
              private ImageView ivRemoteVideo;
              private PreviewView pvLocalVideo;
              private TextView tvPartnerName, tvCallTimer;
              private Button btnMute, btnEndCall, btnSwitchCam;

              private BluetoothAdapter bluetoothAdapter;
              private BluetoothCallService callService;
              private final List<BluetoothDeviceModel> deviceList = new ArrayList<>();
              private DeviceAdapter deviceAdapter;

              private ProcessCameraProvider cameraProvider;
              private int lensFacing = CameraSelector.LENS_FACING_FRONT;
              private ExecutorService cameraExecutor;

              private AudioRecord audioRecord;
              private AudioTrack audioTrack;
              private boolean isRecordingAudio = false;
              private boolean isMuted = false;
              private Thread audioThread;

              private boolean isCallActive = false;
              private long callStartTime = 0;
              private final Handler timerHandler = new Handler(Looper.getMainLooper());
              private final Runnable timerRunnable = new Runnable() {
                  @Override
                  public void run() {
                      if (isCallActive) {
                          long elapsed = (SystemClock.uptimeMillis() - callStartTime) / 1000;
                          long mins = elapsed / 60;
                          long secs = elapsed % 60;
                          tvCallTimer.setText(String.format(Locale.US, "%02d:%02d", mins, secs));
                          timerHandler.postDelayed(this, 1000);
                      }
                  }
              };

              private final BroadcastReceiver discoveryReceiver = new BroadcastReceiver() {
                  @SuppressLint("MissingPermission")
                  @Override
                  public void onReceive(Context context, Intent intent) {
                      String action = intent.getAction();
                      if (BluetoothDevice.ACTION_FOUND.equals(action)) {
                          BluetoothDevice device = intent.getParcelableExtra(BluetoothDevice.EXTRA_DEVICE);
                          if (device != null) {
                              String name = device.getName();
                              String addr = device.getAddress();
                              BluetoothDeviceModel model = new BluetoothDeviceModel(name, addr, device);
                              if (!deviceList.contains(model)) {
                                  deviceList.add(model);
                                  deviceAdapter.notifyDataSetChanged();
                              }
                          }
                      } else if (BluetoothAdapter.ACTION_DISCOVERY_FINISHED.equals(action)) {
                          pbScanning.setVisibility(View.GONE);
                          if (deviceList.isEmpty()) {
                              tvStatus.setText(R.string.no_devices);
                          }
                      }
                  }
              };

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  initViews();
                  initBluetooth();
                  cameraExecutor = Executors.newSingleThreadExecutor();

                  checkPermissions();
              }

              private void initViews() {
                  layoutSetup = findViewById(R.id.layoutSetup);
                  etDeviceName = findViewById(R.id.etDeviceName);
                  btnCreate = findViewById(R.id.btnCreate);
                  btnJoin = findViewById(R.id.btnJoin);
                  tvStatus = findViewById(R.id.tvStatus);
                  tvDeviceListHeader = findViewById(R.id.tvDeviceListHeader);
                  pbScanning = findViewById(R.id.pbScanning);
                  lvDevices = findViewById(R.id.lvDevices);

                  layoutCall = findViewById(R.id.layoutCall);
                  ivRemoteVideo = findViewById(R.id.ivRemoteVideo);
                  pvLocalVideo = findViewById(R.id.pvLocalVideo);
                  tvPartnerName = findViewById(R.id.tvPartnerName);
                  tvCallTimer = findViewById(R.id.tvCallTimer);
                  btnMute = findViewById(R.id.btnMute);
                  btnEndCall = findViewById(R.id.btnEndCall);
                  btnSwitchCam = findViewById(R.id.btnSwitchCam);

                  deviceAdapter = new DeviceAdapter(this, deviceList);
                  lvDevices.setAdapter(deviceAdapter);

                  String defaultName = Build.MANUFACTURER + " " + Build.MODEL;
                  etDeviceName.setText(defaultName);

                  btnCreate.setOnClickListener(v -> startHosting());
                  btnJoin.setOnClickListener(v -> startSearching());

                  lvDevices.setOnItemClickListener((parent, view, position, id) -> {
                      BluetoothDeviceModel selected = deviceList.get(position);
                      connectToHost(selected.getDevice());
                  });

                  btnEndCall.setOnClickListener(v -> hangUpCall());

                  btnMute.setOnClickListener(v -> {
                      isMuted = !isMuted;
                      btnMute.setText(isMuted ? R.string.btn_unmute : R.string.btn_mute);
                      Toast.makeText(this, isMuted ? "تم كتم الميكروفون" : "تم تشغيل الميكروفون", Toast.LENGTH_SHORT).show();
                  });

                  btnSwitchCam.setOnClickListener(v -> {
                      lensFacing = (lensFacing == CameraSelector.LENS_FACING_FRONT) 
                          ? CameraSelector.LENS_FACING_BACK 
                          : CameraSelector.LENS_FACING_FRONT;
                      bindCameraUseCases();
                  });
              }

              private void initBluetooth() {
                  BluetoothManager bm = (BluetoothManager) getSystemService(Context.BLUETOOTH_SERVICE);
                  bluetoothAdapter = (bm != null) ? bm.getAdapter() : BluetoothAdapter.getDefaultAdapter();
                  if (bluetoothAdapter == null) {
                      Toast.makeText(this, "جهازك لا يدعم البلوتوث", Toast.LENGTH_LONG).show();
                      finish();
                      return;
                  }

                  callService = new BluetoothCallService(this);

                  IntentFilter filter = new IntentFilter();
                  filter.addAction(BluetoothDevice.ACTION_FOUND);
                  filter.addAction(BluetoothAdapter.ACTION_DISCOVERY_FINISHED);
                  registerReceiver(discoveryReceiver, filter);
              }

              private String getEnteredDeviceName() {
                  String name = etDeviceName.getText().toString().trim();
                  return name.isEmpty() ? (Build.MANUFACTURER + " " + Build.MODEL) : name;
              }

              @SuppressLint("MissingPermission")
              private void startHosting() {
                  if (!hasRequiredPermissions()) {
                      checkPermissions();
                      return;
                  }

                  if (!bluetoothAdapter.isEnabled()) {
                      Toast.makeText(this, "يرجى تشغيل البلوتوث أولاً", Toast.LENGTH_SHORT).show();
                      return;
                  }

                  Intent discoverableIntent = new Intent(BluetoothAdapter.ACTION_REQUEST_DISCOVERABLE);
                  discoverableIntent.putExtra(BluetoothAdapter.EXTRA_DISCOVERABLE_DURATION, 300);
                  startActivity(discoverableIntent);

                  tvStatus.setText(R.string.status_hosting);
                  pbScanning.setVisibility(View.GONE);
                  tvDeviceListHeader.setVisibility(View.GONE);
                  lvDevices.setVisibility(View.GONE);

                  callService.startServer(getEnteredDeviceName());
              }

              @SuppressLint("MissingPermission")
              private void startSearching() {
                  if (!hasRequiredPermissions()) {
                      checkPermissions();
                      return;
                  }

                  if (!bluetoothAdapter.isEnabled()) {
                      Toast.makeText(this, "يرجى تشغيل البلوتوث أولاً", Toast.LENGTH_SHORT).show();
                      return;
                  }

                  deviceList.clear();
                  deviceAdapter.notifyDataSetChanged();

                  Set<BluetoothDevice> paired = bluetoothAdapter.getBondedDevices();
                  if (paired != null) {
                      for (BluetoothDevice d : paired) {
                          deviceList.add(new BluetoothDeviceModel(d.getName(), d.getAddress(), d));
                      }
                  }
                  deviceAdapter.notifyDataSetChanged();

                  if (bluetoothAdapter.isDiscovering()) {
                      bluetoothAdapter.cancelDiscovery();
                  }
                  bluetoothAdapter.startDiscovery();

                  tvStatus.setText(R.string.status_searching);
                  pbScanning.setVisibility(View.VISIBLE);
                  tvDeviceListHeader.setVisibility(View.VISIBLE);
                  lvDevices.setVisibility(View.VISIBLE);
              }

              @SuppressLint("MissingPermission")
              private void connectToHost(BluetoothDevice device) {
                  if (bluetoothAdapter.isDiscovering()) {
                      bluetoothAdapter.cancelDiscovery();
                  }
                  tvStatus.setText(R.string.status_connecting);
                  pbScanning.setVisibility(View.VISIBLE);

                  callService.connect(device, getEnteredDeviceName());
              }

              @Override
              public void onConnected(String remoteDeviceName) {
                  runOnUiThread(() -> {
                      isCallActive = true;
                      layoutSetup.setVisibility(View.GONE);
                      layoutCall.setVisibility(View.VISIBLE);

                      tvPartnerName.setText(getString(R.string.call_in_progress) + " " + remoteDeviceName);
                      callStartTime = SystemClock.uptimeMillis();
                      timerHandler.post(timerRunnable);

                      startCamera();
                      startAudio();
                  });
              }

              @Override
              public void onConnectionFailed() {
                  runOnUiThread(() -> {
                      pbScanning.setVisibility(View.GONE);
                      tvStatus.setText("فشل الاتصال! تأكد من أن الطرف الآخر قام بالإنشاء وحاول مجدداً.");
                      Toast.makeText(this, "فشل الاتصال بالطرف الآخر", Toast.LENGTH_SHORT).show();
                  });
              }

              @Override
              public void onConnectionLost() {
                  runOnUiThread(() -> {
                      Toast.makeText(this, "انقطع الاتصال بالطرف الآخر", Toast.LENGTH_SHORT).show();
                      hangUpCall();
                  });
              }

              @Override
              public void onVideoReceived(byte[] data) {
                  try {
                      Bitmap bmp = BitmapFactory.decodeByteArray(data, 0, data.length);
                      if (bmp != null) {
                          ivRemoteVideo.setImageBitmap(bmp);
                      }
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
              }

              @Override
              public void onAudioReceived(byte[] data) {
                  if (audioTrack != null && isCallActive) {
                      try {
                          audioTrack.write(data, 0, data.length);
                      } catch (Exception e) {
                          e.printStackTrace();
                      }
                  }
              }

              @Override
              public void onCallEndedRemote() {
                  runOnUiThread(() -> {
                      Toast.makeText(this, "أنهى الطرف الآخر المكالمة", Toast.LENGTH_SHORT).show();
                      resetCallUI();
                  });
              }

              private void hangUpCall() {
                  if (callService != null) {
                      callService.endCall();
                  }
                  resetCallUI();
              }

              private void resetCallUI() {
                  isCallActive = false;
                  timerHandler.removeCallbacks(timerRunnable);

                  stopCamera();
                  stopAudio();

                  layoutCall.setVisibility(View.GONE);
                  layoutSetup.setVisibility(View.VISIBLE);
                  tvStatus.setText(R.string.status_ready);
                  pbScanning.setVisibility(View.GONE);
              }

              private void startCamera() {
                  ListenableFuture<ProcessCameraProvider> future = ProcessCameraProvider.getInstance(this);
                  future.addListener(() -> {
                      try {
                          cameraProvider = future.get();
                          bindCameraUseCases();
                      } catch (Exception e) {
                          e.printStackTrace();
                      }
                  }, ContextCompat.getMainExecutor(this));
              }

              private void bindCameraUseCases() {
                  if (cameraProvider == null) return;

                  Preview preview = new Preview.Builder().build();
                  preview.setSurfaceProvider(pvLocalVideo.getSurfaceProvider());

                  ImageAnalysis analysis = new ImageAnalysis.Builder()
                      .setTargetResolution(new Size(320, 240))
                      .setBackpressureStrategy(ImageAnalysis.STRATEGY_KEEP_ONLY_LATEST)
                      .setOutputImageFormat(ImageAnalysis.OUTPUT_IMAGE_FORMAT_RGBA_8888)
                      .build();

                  long[] lastTime = new long[]{0};
                  analysis.setAnalyzer(cameraExecutor, image -> {
                      long now = System.currentTimeMillis();
                      if (isCallActive && now - lastTime[0] >= 120) {
                          lastTime[0] = now;
                          try {
                              Bitmap bmp = image.toBitmap();
                              if (bmp != null) {
                                  Bitmap scaled = Bitmap.createScaledBitmap(bmp, 240, 180, true);
                                  ByteArrayOutputStream baos = new ByteArrayOutputStream();
                                  scaled.compress(Bitmap.CompressFormat.JPEG, 40, baos);
                                  byte[] jpeg = baos.toByteArray();
                                  if (callService != null && isCallActive) {
                                      callService.sendVideoFrame(jpeg);
                                  }
                              }
                          } catch (Exception e) {
                              e.printStackTrace();
                          }
                      }
                      image.close();
                  });

                  CameraSelector selector = (lensFacing == CameraSelector.LENS_FACING_FRONT)
                      ? CameraSelector.DEFAULT_FRONT_CAMERA
                      : CameraSelector.DEFAULT_BACK_CAMERA;

                  try {
                      cameraProvider.unbindAll();
                      cameraProvider.bindToLifecycle(this, selector, preview, analysis);
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
              }

              private void stopCamera() {
                  if (cameraProvider != null) {
                      cameraProvider.unbindAll();
                  }
              }

              private void startAudio() {
                  int sampleRate = 8000;
                  int channelIn = AudioFormat.CHANNEL_IN_MONO;
                  int channelOut = AudioFormat.CHANNEL_OUT_MONO;
                  int format = AudioFormat.ENCODING_PCM_16BIT;

                  int minRec = AudioRecord.getMinBufferSize(sampleRate, channelIn, format);
                  int recBuf = Math.max(minRec, 640);

                  int minPlay = AudioTrack.getMinBufferSize(sampleRate, channelOut, format);
                  int playBuf = Math.max(minPlay, 1280);

                  try {
                      if (ActivityCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED) {
                          audioRecord = new AudioRecord(MediaRecorder.AudioSource.VOICE_COMMUNICATION, sampleRate, channelIn, format, recBuf);
                          audioRecord.startRecording();
                          isRecordingAudio = true;

                          audioThread = new Thread(() -> {
                              byte[] buffer = new byte[640];
                              while (isRecordingAudio && isCallActive) {
                                  int read = audioRecord.read(buffer, 0, buffer.length);
                                  if (read > 0 && !isMuted && callService != null) {
                                      byte[] chunk = new byte[read];
                                      System.arraycopy(buffer, 0, chunk, 0, read);
                                      callService.sendAudioData(chunk);
                                  }
                              }
                          });
                          audioThread.start();
                      }

                      audioTrack = new AudioTrack(AudioManager.STREAM_VOICE_CALL, sampleRate, channelOut, format, playBuf, AudioTrack.MODE_STREAM);
                      audioTrack.play();

                      AudioManager am = (AudioManager) getSystemService(Context.AUDIO_SERVICE);
                      if (am != null) {
                          am.setMode(AudioManager.MODE_IN_COMMUNICATION);
                          am.setSpeakerphoneOn(true);
                      }
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
              }

              private void stopAudio() {
                  isRecordingAudio = false;
                  if (audioThread != null) {
                      try {
                          audioThread.join(400);
                      } catch (InterruptedException ignored) {}
                      audioThread = null;
                  }
                  if (audioRecord != null) {
                      try {
                          audioRecord.stop();
                          audioRecord.release();
                      } catch (Exception ignored) {}
                      audioRecord = null;
                  }
                  if (audioTrack != null) {
                      try {
                          audioTrack.stop();
                          audioTrack.release();
                      } catch (Exception ignored) {}
                      audioTrack = null;
                  }
                  AudioManager am = (AudioManager) getSystemService(Context.AUDIO_SERVICE);
                  if (am != null) {
                      am.setMode(AudioManager.MODE_NORMAL);
                  }
              }

              private boolean hasRequiredPermissions() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                      return ContextCompat.checkSelfPermission(this, Manifest.permission.BLUETOOTH_SCAN) == PackageManager.PERMISSION_GRANTED &&
                             ContextCompat.checkSelfPermission(this, Manifest.permission.BLUETOOTH_CONNECT) == PackageManager.PERMISSION_GRANTED &&
                             ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA) == PackageManager.PERMISSION_GRANTED &&
                             ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED;
                  } else {
                      return ContextCompat.checkSelfPermission(this, Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED &&
                             ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA) == PackageManager.PERMISSION_GRANTED &&
                             ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED;
                  }
              }

              private void checkPermissions() {
                  List<String> needed = new ArrayList<>();
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED) {
                      needed.add(Manifest.permission.CAMERA);
                  }
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      needed.add(Manifest.permission.RECORD_AUDIO);
                  }

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.BLUETOOTH_SCAN) != PackageManager.PERMISSION_GRANTED) {
                          needed.add(Manifest.permission.BLUETOOTH_SCAN);
                      }
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.BLUETOOTH_CONNECT) != PackageManager.PERMISSION_GRANTED) {
                          needed.add(Manifest.permission.BLUETOOTH_CONNECT);
                      }
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.BLUETOOTH_ADVERTISE) != PackageManager.PERMISSION_GRANTED) {
                          needed.add(Manifest.permission.BLUETOOTH_ADVERTISE);
                      }
                  } else {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED) {
                          needed.add(Manifest.permission.ACCESS_FINE_LOCATION);
                      }
                  }

                  if (!needed.isEmpty()) {
                      ActivityCompat.requestPermissions(this, needed.toArray(new String[0]), PERMISSION_REQ_CODE);
                  }
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, @NonNull String[] permissions, @NonNull int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode == PERMISSION_REQ_CODE) {
                      boolean allGranted = true;
                      for (int res : grantResults) {
                          if (res != PackageManager.PERMISSION_GRANTED) {
                              allGranted = false;
                              break;
                          }
                      }
                      if (!allGranted) {
                          Toast.makeText(this, R.string.permission_required, Toast.LENGTH_LONG).show();
                      }
                  }
              }

              @Override
              protected void onDestroy() {
                  super.onDestroy();
                  try {
                      unregisterReceiver(discoveryReceiver);
                  } catch (Exception ignored) {}
                  hangUpCall();
                  if (cameraExecutor != null) {
                      cameraExecutor.shutdown();
                  }
              }
          }
