name: Build Bluetooth Call APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Android Project
        run: |
          mkdir -p app/src/main/java/com/example/bluetoothcall
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          # 1. settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "BluetoothCall"
          include ':app'
          EOF

          # 2. root build.gradle
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          # 3. gradle.properties
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          # 4. app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.example.bluetoothcall'
              compileSdk 34

              defaultConfig {
                  applicationId "com.example.bluetoothcall"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
                  debug {
                      debuggable true
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
              implementation 'androidx.camera:camera-core:1.3.1'
              implementation 'androidx.camera:camera-camera2:1.3.1'
              implementation 'androidx.camera:camera-lifecycle:1.3.1'
              implementation 'androidx.camera:camera-view:1.3.1'
              implementation 'com.google.guava:guava:31.1-android'
          }
          EOF

          # 5. AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools"
              package="com.example.bluetoothcall">

              <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />

              <uses-permission android:name="android.permission.BLUETOOTH_SCAN"
                  android:usesPermissionFlags="neverForLocation"
                  tools:targetApi="s" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADVERTISE" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />

              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />

              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />
              <uses-feature android:name="android.hardware.bluetooth" android:required="true" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_app_icon"
                  android:label="@string/app_name"
                  android:roundIcon="@drawable/ic_app_icon"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.BluetoothCall">
                  
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>

          </manifest>
          EOF

          # 6. Colors
          cat << 'EOF' > app/src/main/res/values/colors.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="primary">#2563EB</color>
              <color name="primary_dark">#1D4ED8</color>
              <color name="accent">#10B981</color>
              <color name="bg_main">#0F172A</color>
              <color name="card_bg">#1E293B</color>
              <color name="input_bg">#334155</color>
              <color name="text_white">#F8FAFC</color>
              <color name="text_gray">#94A3B8</color>
              <color name="danger">#DC2626</color>
          </resources>
          EOF

          # 7. Strings
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Bluetooth Call</string>
              <string name="app_subtitle">مكالمة صوت وصورة محلية عبر البلوتوث دون إنترنت</string>
              <string name="device_name_label">اسم جهازك (سيظهر للطرف الآخر):</string>
              <string name="device_name_hint">أدخل اسم جهازك هنا</string>
              <string name="btn_create">إنشاء مكالمة (استضافة)</string>
              <string name="btn_join">انضمام لمكالمة (بحث)</string>
              <string name="status_ready">جاهز للبدء. اختر إنشاء أو انضمام.</string>
              <string name="status_hosting">جاري انتظار اتصال الطرف الآخر... جهازك مرئي الآن</string>
              <string name="status_searching">جاري البحث عن أجهزة قريبة...</string>
              <string name="status_connecting">جاري الاتصال...</string>
              <string name="status_connected">تم الاتصال بنجاح!</string>
              <string name="call_in_progress">مكالمة جارية مع:</string>
              <string name="btn_end_call">إنهاء المكالمة</string>
              <string name="btn_switch_cam">تبديل الكاميرا</string>
              <string name="btn_mute">كتم الصوت</string>
              <string name="btn_unmute">تشغيل الصوت</string>
              <string name="nearby_devices">الأجهزة المقترنة والقريبة:</string>
              <string name="no_devices">لم يتم العثور على أجهزة بعد</string>
              <string name="permission_required">يرجى منح أذونات الكاميرا والمايكروفون والبلوتوث لتشغيل المكالمة</string>
          </resources>
          EOF

          # 8. Themes
          cat << 'EOF' > app/src/main/res/values/themes.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.BluetoothCall" parent="Theme.Material3.Dark.NoActionBar">
                  <item name="colorPrimary">@color/primary</item>
                  <item name="android:windowBackground">@color/bg_main</item>
                  <item name="android:statusBarColor">@color/bg_main</item>
              </style>
          </resources>
          EOF

          # 9. Icon
          cat << 'EOF' > app/src/main/res/drawable/ic_app_icon.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#2563EB"
                  android:pathData="M0,0h108v108h-108z"/>
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M65.9,54.1c-1.3,-0.3 -2.6,0.1 -3.6,1l-4.1,4.1c-6.8,-3.5 -12.4,-9.1 -15.9,-15.9l4.1,-4.1c0.9,-0.9 1.3,-2.3 1,-3.6 -0.6,-3.4 -0.6,-6.9 0,-10.3 0.4,-2.2 -1.3,-4.3 -3.5,-4.3H32.8c-2.3,0 -4.2,1.9 -4.2,4.2 0,22.1 17.9,40 40,40 2.3,0 4.2,-1.9 4.2,-4.2v-11.1c0,-2.2 -2.1,-3.9 -4.3,-3.5 -3.4,0.6 -6.9,0.6 -10.3,0z"/>
          </vector>
          EOF

          # 10. Item Selector
          cat << 'EOF' > app/src/main/res/drawable/item_selector.xml
          <?xml version="1.0" encoding="utf-8"?>
          <selector xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:state_pressed="true">
                  <shape>
                      <solid android:color="@color/input_bg" />
                      <corners android:radius="8dp" />
                  </shape>
              </item>
              <item>
                  <shape>
                      <solid android:color="@color/card_bg" />
                      <corners android:radius="8dp" />
                  </shape>
              </item>
          </selector>
          EOF

          # 11. item_device.xml
          cat << 'EOF' > app/src/main/res/layout/item_device.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:orientation="vertical"
              android:padding="16dp"
              android:background="@drawable/item_selector">

              <TextView
                  android:id="@+id/tvItemDeviceName"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:textColor="@color/text_white"
                  android:textSize="16sp"
                  android:textStyle="bold" />

              <TextView
                  android:id="@+id/tvItemDeviceAddress"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:textColor="@color/text_gray"
                  android:textSize="12sp"
                  android:layout_marginTop="4dp" />
          </LinearLayout>
          EOF

